name: ClashX

on:
  push:
    tags: [ v* ]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name }}
        submodules: recursive

    # 1) 检查 Git 冲突标记（若有则直接失败，便于定位）
    - name: check no conflict markers in project
      run: |
        if grep -rE '<<<<<<<|=======|>>>>>>>' ClashX.xcodeproj/ 2>/dev/null; then
          echo "::error::Found Git conflict markers in ClashX.xcodeproj. Resolve them (e.g. in project.pbxproj) or run: git checkout ClashX.xcodeproj/project.pbxproj"
          exit 1
        fi
        echo "No conflict markers in xcodeproj."

    # 2) 校验 project.pbxproj 格式（plutil 报错会给出具体行号）
    - name: validate project.pbxproj (plutil -lint)
      run: |
        plutil -lint ClashX.xcodeproj/project.pbxproj

    - name: fetch all refs for version info
      run: git fetch origin master 2>/dev/null || true

    - name: download meta core
      uses: robinraju/release-downloader@v1.12
      with:
        repository: 'MetaCubeX/mihomo'
        tag: "v1.19.20"
        fileName: "mihomo-darwin-???64-v?.*.*.gz"

        # releaseId: "62870807"
        # fileName: ".*darwin.*64-alpha.*.gz"
        
        out-file-path: "clash.meta"
        token: ${{ secrets.GITHUB_TOKEN }}

    # 仅修改 ClashX/Info.plist，不触碰 .xcodeproj / project.pbxproj，避免破坏工程解析
    - name: build infos
      run: |
        PLIST="ClashX/Info.plist"
        BUNDLE_VERSION=$(git rev-list --count origin/master..HEAD 2>/dev/null || git rev-list --count HEAD 2>/dev/null || echo "1")
        SHORT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
        CORE_VER=$(ls clash.meta 2>/dev/null | grep -m1 "\.gz$" | sed -ne 's/.*64-\(.*\).gz/\1/p' || echo "")
        /usr/libexec/PlistBuddy -c "Set CFBundleVersion $BUNDLE_VERSION" "$PLIST"
        /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $SHORT_VERSION" "$PLIST"
        /usr/libexec/PlistBuddy -c "Delete :coreVersion" "$PLIST" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add coreVersion string $CORE_VER" "$PLIST"
        /usr/libexec/PlistBuddy -c "Delete :gitBranch" "$PLIST" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add gitBranch string $GITHUB_REF_NAME" "$PLIST"
        /usr/libexec/PlistBuddy -c "Delete :gitCommit" "$PLIST" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add gitCommit string ${GITHUB_SHA::7}" "$PLIST"
        /usr/libexec/PlistBuddy -c "Delete :buildTime" "$PLIST" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add buildTime string $(date +%Y-%m-%d\ %H:%M)" "$PLIST"
        /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST"
        /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST"

    - name: ensure Package.resolved for Xcode (CI)
      run: |
        SWIFTPM_DIR="ClashX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
        mkdir -p "$SWIFTPM_DIR"
        cp ci/Package.resolved "$SWIFTPM_DIR/Package.resolved"

    - name: diagnose project files (before build)
      run: |
        echo "=== conflict markers in xcodeproj ==="
        grep -r "<<<<<<<\\|=======\\|>>>>>>>" ClashX.xcodeproj 2>/dev/null || echo "none"
        echo "=== plutil -lint project.pbxproj ==="
        plutil -lint ClashX.xcodeproj/project.pbxproj 2>&1 || true
        echo "=== first 2 lines of project.pbxproj (hex) ==="
        head -2 ClashX.xcodeproj/project.pbxproj | xxd | head -20
        echo "=== first 2 lines of Package.resolved ==="
        head -2 ClashX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | xxd | head -10

    - name: install deps
      run: bash install_dependency.sh

    - name: build
      run: |
        xcodebuild archive -project ClashX.xcodeproj -scheme ClashX\ Meta -archivePath archive/ClashX.xcarchive -showBuildTimingSummary -allowProvisioningUpdates ARCHS=arm64 ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log; BUILD_EXIT=${PIPESTATUS[0]}
        if [ "$BUILD_EXIT" -ne 0 ]; then
          echo "--- Compiler errors (grep error:) ---"
          grep -n "error:" build.log || true
          echo "--- Last 120 lines ---"
          tail -120 build.log
          exit "$BUILD_EXIT"
        fi

    - name: upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-failed
        path: build.log

    - name: create zip
      run: ditto -c -k --sequesterRsrc --keepParent archive/ClashX.xcarchive/Products/Applications/ClashX\ Meta.app "ClashX Meta.zip"


    - name: upload Artifact
      uses: actions/upload-artifact@v4
      if: "!startsWith(github.ref, 'refs/tags/')"
      with:
        name: "ClashX Meta.zip"
        path: "*.zip"

    - name: load sparkle-repo
      uses: actions/checkout@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        ref: sparkle
        path: 'sparkle-repo'

    - name: update sparkle-repo
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

        rm -f sparkle-repo/*.delta

        cp "ClashX Meta.zip" "sparkle-repo/ClashX Meta $GITHUB_REF_NAME.zip"
        
        brew install sparkle
        echo '${{ secrets.ED_KEY }}' | $(brew --prefix)/Caskroom/sparkle/2.*/bin/generate_appcast sparkle-repo --maximum-deltas 2 --auto-prune-update-files --ed-key-file -
        
        cd sparkle-repo
        rm -rf old_updates
        
        git checkout --orphan temp-sparkle

        git add -A
        git commit -m "Sparkle updates - $GITHUB_REF_NAME"
      

        git branch -D sparkle
        git checkout -b sparkle
        git branch -D temp-sparkle

        git push --force-with-lease origin sparkle

    - name: upload build to github
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        generate_release_notes: true
        files: |
          ClashX Meta.zip

